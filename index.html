<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMC CLUB | Role-Based Ledger</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold-grad: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7); --dark-bg: #0a0a0a; --card-bg: #141414; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Poppins', sans-serif; text-align: center; margin: 0; padding: 0; }
        .container { padding: 20px; max-width: 450px; margin: auto; }
        .card { background: var(--card-bg); border: 1px solid #333; padding: 40px 30px; border-radius: 20px; margin-top: 60px; box-shadow: 0 10px 30px rgba(191, 149, 63, 0.1); }
        .gold-text { background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; letter-spacing: 1px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; font-size: 14px; font-family: 'Poppins', sans-serif; }
        .btn-gold { background: var(--gold-grad); color: #000; font-weight: 600; width: 100%; padding: 15px; cursor: pointer; border: none; border-radius: 10px; font-size: 16px; text-transform: uppercase; margin-top: 10px; }
        #dashboard { display: none; padding-top: 20px; }
        .header-box { background: var(--card-bg); padding: 20px; border-bottom: 2px solid #BF953F; }
        .badge { background: #222; border: 1px solid #BF953F; color: #FCF6BA; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--card-bg); border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; font-size: 13px; }
        th { background: #111; color: #BF953F; text-transform: uppercase; font-size: 11px; }
        .btn-sm { padding: 5px 8px; font-size: 10px; border-radius: 5px; cursor: pointer; border: none; margin-left: 5px; font-weight: bold; }
        .btn-edit { background: #ffa500; color: #000; }
        .btn-del { background: #ff4d4d; color: #fff; }
        .admin-panel { background: #1a1500; border: 1px dashed #BF953F; padding: 20px; border-radius: 15px; margin-bottom: 25px; display: none; }
    </style>
</head>
<body>

    <div id="login-area" class="container">
        <div class="card">
            <h1 class="gold-text">MMC CLUB</h1>
            <input type="tel" id="mobileInput" placeholder="Enter Mobile Number" maxlength="10">
            <button class="btn-gold" onclick="generateOTP()">Get OTP</button>
            <div id="otp-section" style="display:none; margin-top: 20px;">
                <div id="otp-display" style="color: #FCF6BA; font-size: 22px; font-weight: 700; letter-spacing: 4px; margin-bottom: 15px;"></div>
                <input type="number" id="otpInput" placeholder="Enter 4-Digit OTP">
                <button class="btn-gold" onclick="login()">Secure Login</button>
            </div>
        </div>
    </div>

    <div id="dashboard">
        <div class="header-box">
            <h2 class="gold-text">MMC CLUB</h2>
            <div class="badge" id="userRoleDisplay"></div>
        </div>
        <div class="container">
            <div id="admin-section" class="admin-panel">
                <h3 style="color: #BF953F; font-size: 14px; margin-top: 0;">Add New Record</h3>
                <input type="text" id="descInput" placeholder="Description (e.g. Tent Rent)">
                <input type="number" id="amtInput" placeholder="Amount (₹)">
                <button class="btn-gold" style="padding: 10px; font-size: 12px;" onclick="addRecord()">ADD RECORD</button>
            </div>
            
            <div style="text-align: left; margin-top: 10px;">
                <h3 style="margin: 0; font-size: 18px; color: #ccc;">Recent Transactions</h3>
            </div>
            <table>
                <thead><tr><th>Details</th><th>Amount</th><th id="action-col" style="display:none; text-align: center;">Action</th></tr></thead>
                <tbody id="records-list"></tbody>
            </table>
            <button class="btn-gold" style="background: #222; color: #ff4d4d; border: 1px solid #ff4d4d; margin-top: 30px;" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://planning-with-ai-fa788-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentOTP;

        function generateOTP() {
            const phone = document.getElementById('mobileInput').value;
            if(phone.length !== 10) { alert("Invalid Number! Enter 10 digits."); return; }
            currentOTP = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('otp-display').innerText = currentOTP;
            document.getElementById('otp-section').style.display = 'block';
        }

        function login() {
            const enteredOTP = document.getElementById('otpInput').value;
            const phone = document.getElementById('mobileInput').value;
            
            if(enteredOTP == currentOTP) {
                localStorage.setItem("mmc_user", phone);
                
                // OFFICIAL ROLE & NAME ASSIGNMENT
                if(phone === "9937765417") {
                    localStorage.setItem("mmc_role", "President");
                    localStorage.setItem("mmc_name", "SUDHIR DAS");
                }
                else if(phone === "8658441544") {
                    localStorage.setItem("mmc_role", "Manager");
                    localStorage.setItem("mmc_name", "ABANISH DAS");
                }
                else if(phone === "9556082911") {
                    localStorage.setItem("mmc_role", "Secretary");
                    localStorage.setItem("mmc_name", "KRITI RANJAN DAS");
                }
                else {
                    localStorage.setItem("mmc_role", "Member");
                    localStorage.setItem("mmc_name", "Member");
                }
                
                location.reload();
            } else { alert("Incorrect OTP. Please check again."); }
        }

        window.onload = function() {
            const user = localStorage.getItem("mmc_user");
            const role = localStorage.getItem("mmc_role");
            const name = localStorage.getItem("mmc_name");
            
            if(user) {
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                
                // Display Name and Role
                document.getElementById('userRoleDisplay').innerText = role + " | " + name;
                
                // Show Admin Controls if President, Manager, or Secretary
                if(["President", "Manager", "Secretary"].includes(role)) {
                    document.getElementById('admin-section').style.display = 'block';
                    document.getElementById('action-col').style.display = 'table-cell';
                }
                loadData(role);
            }
        }

        function addRecord() {
            const desc = document.getElementById('descInput').value;
            const amt = document.getElementById('amtInput').value;
            if(desc && amt) {
                db.ref('records').push({ desc, amount: amt });
                document.getElementById('descInput').value = '';
                document.getElementById('amtInput').value = '';
            } else {
                alert("Please fill both details!");
            }
        }

        function loadData(role) {
            db.ref('records').on('value', (snap) => {
                const list = document.getElementById('records-list');
                list.innerHTML = "";
                let hasData = false;
                
                snap.forEach((child) => {
                    hasData = true;
                    const d = child.val();
                    const id = child.key;
                    let actions = "";
                    
                    // Show Edit/Delete buttons only to Admins
                    if(["President", "Manager", "Secretary"].includes(role)) {
                        actions = `<td style="text-align: center;">
                            <button class="btn-sm btn-edit" onclick="editRecord('${id}','${d.desc}',${d.amount})">Edit</button>
                            <button class="btn-sm btn-del" onclick="deleteRecord('${id}')">Del</button>
                        </td>`;
                    }
                    list.innerHTML += `<tr><td>${d.desc}</td><td style="color:#FCF6BA; font-weight:bold;">₹${d.amount}</td>${actions}</tr>`;
                });
                
                if(!hasData) {
                    const colspan = ["President", "Manager", "Secretary"].includes(role) ? 3 : 2;
                    list.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center; color:#777; padding: 20px;">No records available.</td></tr>`;
                }
            });
        }

        function editRecord(id, oldDesc, oldAmt) {
            const newDesc = prompt("Edit Description:", oldDesc);
            const newAmt = prompt("Edit Amount (₹):", oldAmt);
            if(newDesc !== null && newAmt !== null && newDesc !== "" && newAmt !== "") {
                db.ref('records/' + id).update({ desc: newDesc, amount: newAmt });
            }
        }

        function deleteRecord(id) {
            if(confirm("Are you sure you want to delete this record permanently?")) {
                db.ref('records/' + id).remove();
            }
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
