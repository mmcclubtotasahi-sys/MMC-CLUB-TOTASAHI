<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAA MANGALA CLUB | Secure Ledger</title>
    <link rel="icon" href="3d-1.png" type="image/png">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --gold-grad: linear-gradient(135deg, #D4AF37, #FFF2CD, #AA8222); --dark: #080808; --card: #121212; }
        body { background: var(--dark); color: #fff; font-family: 'Poppins', sans-serif; text-align: center; margin: 0; padding: 0; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: var(--card); border: 1px solid #222; padding: 30px; border-radius: 16px; margin-top: 30px; box-shadow: 0 8px 32px rgba(212, 175, 55, 0.05); }
        .app-logo { width: 110px; filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.8)); margin-bottom: 5px; }
        .gold-text { background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; margin: 5px 0; letter-spacing: 1px; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 14px; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--gold); outline: none; }
        .btn-gold { background: var(--gold-grad); color: #000; font-weight: 700; width: 100%; padding: 14px; cursor: pointer; border: none; border-radius: 8px; font-size: 15px; text-transform: uppercase; margin-top: 15px; transition: 0.3s; letter-spacing: 1px; }
        .tab-box { display: flex; border-bottom: 1px solid #333; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; cursor: pointer; color: #666; font-weight: 600; border-bottom: 3px solid transparent; font-size: 11px; transition: 0.3s; text-transform: uppercase; }
        .tab-btn.active { color: var(--gold); border-bottom: 3px solid var(--gold); }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.5s ease; }
        #dashboard { display: none; }
        .header-box { background: var(--card); padding: 20px 15px; border-bottom: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; gap: 15px; }
        .badge { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: #FFF2CD; padding: 6px 16px; border-radius: 30px; font-size: 12px; font-weight: 600; display: inline-block; }
        .fy-banner { background: #1a1500; border: 1px solid var(--gold); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
        .fy-banner h3 { margin: 0; font-size: 15px; color: var(--gold); text-transform: uppercase; }
        .fy-banner select { width: auto; padding: 8px 15px; margin: 0; background: #000; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; border-radius: 6px; }
        .summary-container { display: flex; gap: 12px; margin-bottom: 25px; }
        .sum-box { background: #111; padding: 20px 10px; border-radius: 12px; flex: 1; border: 1px solid #222; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .sum-box h4 { margin: 0 0 8px 0; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .sum-box .amt { font-size: 18px; font-weight: 700; }
        .text-inc { color: #4ade80; } .text-exp { color: #f87171; } .text-bal { color: var(--gold); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        th, td { padding: 15px 12px; text-align: left; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
        th { background: #0a0a0a; color: #888; text-transform: uppercase; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; border-bottom: 1px solid #333; }
        .type-badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
        .bg-inc { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
        .bg-exp { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
        .cat-badge { background: #222; color: #ccc; padding: 3px 8px; border-radius: 4px; font-size: 10px; margin-left: 6px; border: 1px solid #444; }
        .time-txt { font-size: 11px; color: #777; display: block; margin-top: 6px; }
        .action-flex { display: flex; gap: 5px; flex-wrap: wrap; }
        .btn-sm { padding: 6px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; flex: 1; transition: 0.2s; }
        .btn-del { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid #f87171; }
        .btn-pdf { background: rgba(212, 175, 55, 0.1); color: var(--gold); border: 1px solid var(--gold); }
        .btn-wa { background: rgba(37, 211, 102, 0.1); color: #25D366; border: 1px solid #25D366; }
        .admin-panel { background: #0d0d0d; border: 1px solid #333; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="login-area" class="container">
        <div class="card">
            <img id="logo-img" src="3d-1.png" alt="MMC Logo" class="app-logo" onerror="this.style.display='none'">
            <h1 class="gold-text">MAA MANGALA CLUB</h1>
            <p style="color: #666; font-size: 12px; margin-bottom: 25px; letter-spacing: 1px;">SECURE DIGITAL LEDGER</p>
            <div class="tab-box">
                <div id="tab-mem" class="tab-btn active" onclick="switchLogin('member')">MEMBER</div>
                <div id="tab-adm" class="tab-btn" onclick="switchLogin('admin')">ADMINISTRATION</div>
            </div>
            <div id="form-member" class="form-section active">
                <input type="tel" id="memPhone" placeholder="Enter Registered Mobile No." maxlength="10">
                <button class="btn-gold" onclick="requestOTP()">GENERATE OTP</button>
                <div id="otp-section" style="display:none; margin-top: 20px;">
                    <div id="otp-display" style="color: var(--gold); font-size: 24px; font-weight: 700; letter-spacing: 5px; margin-bottom: 15px;"></div>
                    <input type="number" id="memOtp" placeholder="Enter OTP">
                    <button class="btn-gold" onclick="verifyMemberLogin()">VERIFY & PROCEED</button>
                </div>
            </div>
            <div id="form-admin" class="form-section">
                <input type="tel" id="admPhone" placeholder="Admin Mobile Number" maxlength="10">
                <input type="password" id="admPass" placeholder="Security Password">
                <button class="btn-gold" onclick="adminLogin()">SECURE LOGIN</button>
            </div>
        </div>
    </div>

    <div id="dashboard">
        <div class="header-box">
            <img src="3d-1.png" alt="Logo" style="width: 50px;" onerror="this.style.display='none'">
            <div style="text-align: left;">
                <h2 class="gold-text" style="font-size: 18px; margin: 0;">MAA MANGALA CLUB</h2>
                <div class="badge" id="userRoleDisplay" style="margin-top: 5px;"></div>
            </div>
        </div>
        <div class="container">
            <div id="admin-controls" style="display:none; margin-bottom: 20px;">
                <div class="tab-box" style="margin-bottom: 15px;">
                    <div id="tab-ledger" class="tab-btn active" onclick="switchAdminTab('ledger')">📝 ENTRY</div>
                    <div id="tab-users" class="tab-btn" onclick="switchAdminTab('users')">👥 MEMBERS</div>
                    <div id="tab-deleted" class="tab-btn" style="display:none;" onclick="switchAdminTab('deleted')">🗑️ TRASH</div>
                </div>
                <div id="admin-ledger" class="admin-panel active" style="display:block;">
                    <select id="typeInput" onchange="toggleAddForm()">
                        <option value="income">Income / ଆୟ (Credit)</option>
                        <option value="expense">Expense / ବ୍ୟୟ (Debit)</option>
                    </select>
                    <div id="inc-form">
                        <select id="incomeCategory">
                            <option value="ଘର ଚାନ୍ଦା (House Chanda)">🏠 ଘର ଚାନ୍ଦା (House Chanda)</option>
                            <option value="ମେମ୍ବର ଚାନ୍ଦା (Member Chanda)">👤 ମେମ୍ବର ଚାନ୍ଦା (Member Chanda)</option>
                            <option value="ଅନ୍ୟାନ୍ୟ ଦାନ (Other Donation)">🎁 ଅନ୍ୟାନ୍ୟ ଦାନ (Other Donation)</option>
                        </select>
                        <select id="memberSelect" onchange="checkGuest()"><option value="guest">Other / Non-Member</option></select>
                        <input type="text" id="guestInput" placeholder="ଦାନକର୍ତ୍ତାଙ୍କ ନାମ (Name)">
                    </div>
                    <div id="exp-form" style="display:none;"><input type="text" id="descInput" placeholder="ଖର୍ଚ୍ଚ ବିବରଣୀ (Expense Purpose)"></div>
                    <input type="number" id="amtInput" placeholder="Amount (₹)">
                    <button class="btn-gold" style="padding: 12px;" onclick="addRecord()">SAVE TO LEDGER</button>
                </div>
                <div id="admin-users" class="admin-panel">
                    <input type="text" id="newMemName" placeholder="Full Name">
                    <input type="tel" id="newMemPhone" placeholder="Mobile Number" maxlength="10">
                    <button class="btn-gold" style="background: #25D366; color:#fff;" onclick="addMember()">ADD MEMBER</button>
                    <table id="members-table"><tbody id="members-list"></tbody></table>
                </div>
                <div id="admin-deleted" class="admin-panel">
                    <h3 style="color: #f87171; font-size: 14px;">Trash History (President Only)</h3>
                    <table id="deleted-table"><tbody id="deleted-list"></tbody></table>
                </div>
            </div>
            <div class="fy-banner">
                <h3>Financial Year</h3>
                <select id="yearFilter" onchange="loadRecords()"></select>
            </div>
            <div class="summary-container">
                <div class="sum-box"><h4 class="text-inc">Income</h4><div id="totInc" class="amt text-inc">₹0</div></div>
                <div class="sum-box"><h4 class="text-exp">Expense</h4><div id="totExp" class="amt text-exp">₹0</div></div>
                <div class="sum-box"><h4 class="text-bal">Balance</h4><div id="totBal" class="amt text-bal">₹0</div></div>
            </div>
            <table><tbody id="records-list"></tbody></table>
            <button class="btn-gold" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; margin-top: 40px;" onclick="logout()">SECURE SIGN OUT</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://planning-with-ai-fa788-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentOTP;

        // Admin Credentials Updated
        const ADMIN_DB = {
            "9937765417": { role: "President", name: "SUDHIR DAS", pass: "CHAMP993868" },
            "8658441544": { role: "Manager", name: "ABANISH DAS", pass: "CHAMPIONS2026" },
            "9556082911": { role: "Secretary", name: "KRITI RANJAN DAS", pass: "CHAMPIONS2026" }
        };

        function switchLogin(type) {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-box .tab-btn').forEach(el => el.classList.remove('active'));
            if(type === 'member') { document.getElementById('form-member').classList.add('active'); document.getElementById('tab-mem').classList.add('active'); } 
            else { document.getElementById('form-admin').classList.add('active'); document.getElementById('tab-adm').classList.add('active'); }
        }

        function switchAdminTab(type) {
            document.querySelectorAll('.admin-panel').forEach(el => el.style.display = 'none');
            document.querySelectorAll('#admin-controls .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('admin-'+type).style.display = 'block';
            document.getElementById('tab-'+type).classList.add('active');
        }

        function adminLogin() {
            const phone = document.getElementById('admPhone').value; const pass = document.getElementById('admPass').value;
            if(ADMIN_DB[phone] && ADMIN_DB[phone].pass === pass) {
                localStorage.setItem("mmc_user", phone); localStorage.setItem("mmc_role", ADMIN_DB[phone].role); localStorage.setItem("mmc_name", ADMIN_DB[phone].name);
                location.reload();
            } else { alert("Invalid Credentials!"); }
        }

        function requestOTP() {
            const phone = document.getElementById('memPhone').value;
            db.ref('members/' + phone).once('value', (snap) => {
                if(snap.exists()) {
                    currentOTP = Math.floor(1000 + Math.random() * 9000);
                    document.getElementById('otp-display').innerText = currentOTP;
                    document.getElementById('otp-section').style.display = 'block';
                } else { alert("Not registered!"); }
            });
        }

        function verifyMemberLogin() {
            if(document.getElementById('memOtp').value == currentOTP) {
                localStorage.setItem("mmc_user", document.getElementById('memPhone').value);
                localStorage.setItem("mmc_role", "Member");
                location.reload();
            } else { alert("Wrong OTP!"); }
        }

        window.onload = function() {
            const role = localStorage.getItem("mmc_role");
            const yearDrop = document.getElementById('yearFilter'); const currentYear = new Date().getFullYear();
            for(let i = currentYear; i >= 2024; i--) { yearDrop.innerHTML += `<option value="${i}">${i}</option>`; }
            if(localStorage.getItem("mmc_user")) {
                document.getElementById('login-area').style.display = 'none'; document.getElementById('dashboard').style.display = 'block';
                document.getElementById('userRoleDisplay').innerText = role;
                if(["President", "Manager", "Secretary"].includes(role)) {
                    document.getElementById('admin-controls').style.display = 'block'; fetchMembers();
                    if(role === "President") { document.getElementById('tab-deleted').style.display = 'block'; loadDeletedRecords(); }
                }
                loadRecords();
            }
        }

        function addRecord() {
            const type = document.getElementById('typeInput').value; const amt = document.getElementById('amtInput').value;
            let desc = (type === 'income') ? (document.getElementById('memberSelect').value === 'guest' ? document.getElementById('guestInput').value : document.getElementById('memberSelect').options[document.getElementById('memberSelect').selectedIndex].text.split(' - ')[0]) : document.getElementById('descInput').value;
            db.ref('records').push({ type, desc, amount: Number(amt), category: document.getElementById('incomeCategory').value, timestamp: Date.now() });
            location.reload();
        }

        function loadRecords() {
            const selectedYear = parseInt(document.getElementById('yearFilter').value);
            db.ref('records').on('value', (snap) => {
                const list = document.getElementById('records-list'); list.innerHTML = "";
                let tI = 0, tE = 0;
                snap.forEach(child => {
                    const d = child.val();
                    if(new Date(d.timestamp).getFullYear() === selectedYear) {
                        if(d.type === 'income') tI += d.amount; else tE += d.amount;
                        list.innerHTML += `<tr><td>${d.desc}<br><span class="time-txt">${new Date(d.timestamp).toLocaleString()}</span></td><td>₹${d.amount}</td>${localStorage.getItem("mmc_role") === "President" ? `<td><button class="btn-sm btn-del" onclick="moveToTrash('${child.key}')">Del</button></td>` : ""}</tr>`;
                    }
                });
                document.getElementById('totInc').innerText = "₹" + tI; document.getElementById('totExp').innerText = "₹" + tE; document.getElementById('totBal').innerText = "₹" + (tI - tE);
            });
        }

        function moveToTrash(id) {
            db.ref('records/' + id).once('value', snap => {
                db.ref('deleted_records/' + id).set({...snap.val(), deletedAt: Date.now()}).then(() => db.ref('records/' + id).remove());
            });
        }

        function loadDeletedRecords() {
            db.ref('deleted_records').on('value', snap => {
                const list = document.getElementById('deleted-list'); list.innerHTML = "";
                snap.forEach(child => {
                    list.innerHTML += `<tr><td>${child.val().desc}</td><td>₹${child.val().amount}</td><td><button class="btn-sm btn-del" onclick="db.ref('deleted_records/${child.key}').remove()">Clear</button></td></tr>`;
                });
            });
        }

        function fetchMembers() {
            db.ref('members').on('value', snap => {
                const list = document.getElementById('members-list'); const drop = document.getElementById('memberSelect');
                list.innerHTML = ""; drop.innerHTML = '<option value="guest">Other</option>';
                snap.forEach(child => {
                    list.innerHTML += `<tr><td>${child.val().name}</td><td>${child.val().phone}</td><td><button class="btn-sm btn-del" onclick="db.ref('members/${child.key}').remove()">Del</button></td></tr>`;
                    drop.innerHTML += `<option value="${child.val().phone}">${child.val().name}</option>`;
                });
            });
        }

        function addMember() {
            db.ref('members/' + document.getElementById('newMemPhone').value).set({ name: document.getElementById('newMemName').value, phone: document.getElementById('newMemPhone').value });
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
