<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMC CLUB</title>

<!-- Firebase v9 Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f0f0f;
    color:white;
}
header {
    background:#000;
    padding:15px;
    text-align:center;
    color:#D4AF37;
    font-size:20px;
}
.container { padding:15px; }

input, button {
    padding:10px;
    margin:5px 0;
    width:100%;
    border:none;
    border-radius:5px;
}
button {
    background:#D4AF37;
    color:black;
    font-weight:bold;
}

.card {
    background:#1c1c1c;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

table {
    width:100%;
    border-collapse: collapse;
}
th, td {
    padding:8px;
    border-bottom:1px solid #333;
}
th { color:#D4AF37; }

.hidden { display:none; }

.nav {
    display:flex;
    justify-content:space-around;
    background:#000;
    padding:10px;
}
.nav button {
    width:auto;
    padding:10px 20px;
}

@media(max-width:600px){
    table { font-size:12px; }
}
</style>
</head>

<body>

<header>MMC CLUB</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox">
    <h3>Login</h3>
    <input type="text" id="phone" placeholder="Enter Phone Number">
    <button onclick="sendOTP()">Send OTP</button>

    <div id="otpSection" class="hidden">
        <input type="text" id="otp" placeholder="Enter OTP">
        <button onclick="verifyOTP()">Verify</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

    <div class="nav">
        <button onclick="showTab('dashboard')">Dashboard</button>
        <button onclick="showTab('ledger')">My Ledger</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">

        <div id="formSection" class="card hidden">
            <input type="text" id="name" placeholder="Name">
            <input type="number" id="amount" placeholder="Amount">
            <select id="type">
                <option value="Expense">Expense</option>
                <option value="Donation">Donation</option>
            </select>
            <button onclick="addRecord()">Save</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>

    <!-- LEDGER -->
    <div id="ledger" class="hidden">
        <h3>My Ledger</h3>
        <div id="ledgerData"></div>
    </div>

</div>

</div>

<script>
// 🔥 Firebase Config (REPLACE THIS)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// GLOBALS
let generatedOTP = "";
let userPhone = "";
let role = "";

// SEND OTP
function sendOTP(){
    userPhone = document.getElementById("phone").value;

    if(userPhone.length !== 10){
        alert("Enter valid number");
        return;
    }

    generatedOTP = Math.floor(1000 + Math.random() * 9000);

    let msg = `Your MMC CLUB OTP is: ${generatedOTP}`;
    let url = `https://wa.me/91${userPhone}?text=${encodeURIComponent(msg)}`;

    window.open(url, "_blank");

    document.getElementById("otpSection").classList.remove("hidden");
}

// VERIFY OTP
function verifyOTP(){
    let entered = document.getElementById("otp").value;

    if(entered == generatedOTP){
        setupRole();
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        initApp();
    } else {
        alert("Wrong OTP");
    }
}

// ROLE LOGIC
function setupRole(){
    if(userPhone === "9937765417"){
        role = "President";
    } else if(["9999999999","8888888888"].includes(userPhone)){
        role = "Manager";
    } else {
        role = "Member";
    }

    if(role !== "Member"){
        document.getElementById("formSection").classList.remove("hidden");
    }
}

// ADD RECORD
function addRecord(){
    let name = document.getElementById("name").value;
    let amount = document.getElementById("amount").value;
    let type = document.getElementById("type").value;

    db.ref("records").push({
        name,
        amount,
        type,
        phone: userPhone
    });
}

// LOAD DATA
function initApp(){
    db.ref("records").on("value", snap=>{
        let data = snap.val();
        let html = "";
        let ledgerHtml = "";

        for(let id in data){
            let d = data[id];

            // Dashboard
            html += `
            <tr>
                <td>${d.name}</td>
                <td>${d.amount}</td>
                <td>${d.type}</td>
                <td>
                    ${getActions(id)}
                </td>
            </tr>`;

            // Personal Ledger
            if(d.phone === userPhone){
                ledgerHtml += `
                <div class="card">
                    ${d.name} - ₹${d.amount} (${d.type})
                </div>`;
            }
        }

        document.getElementById("dataTable").innerHTML = html;
        document.getElementById("ledgerData").innerHTML = ledgerHtml;
    });
}

// ACTION BUTTONS
function getActions(id){
    if(role === "President"){
        return `
        <button onclick="editRecord('${id}')">Edit</button>
        <button onclick="deleteRecord('${id}')">Delete</button>`;
    }

    if(role === "Manager"){
        return `<button onclick="editRecord('${id}')">Edit</button>`;
    }

    return "";
}

// DELETE
function deleteRecord(id){
    db.ref("records/"+id).remove();
}

// EDIT
function editRecord(id){
    let newAmount = prompt("Enter new amount");
    if(newAmount){
        db.ref("records/"+id).update({amount:newAmount});
    }
}

// TABS
function showTab(tab){
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("ledger").classList.add("hidden");

    document.getElementById(tab).classList.remove("hidden");
}
</script>

</body>
</html>
