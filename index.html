<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMC CLUB - DIGITAL MANAGEMENT</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --gold: #D4AF37; --dark: #000000; --card: #1a1a1a; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 0; }
        .container { padding: 20px; max-width: 500px; margin: auto; }
        .card { background: var(--card); border: 1px solid var(--gold); padding: 30px; border-radius: 15px; margin-top: 50px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; font-size: 16px; }
        .btn-gold { background: var(--gold); color: black; font-weight: bold; width: 100%; padding: 12px; cursor: pointer; border: none; border-radius: 8px; font-size: 16px; transition: 0.3s; }
        .btn-gold:hover { background: #b8952d; }
        #app-content { display: none; }
        .tabs { display: flex; background: #111; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
        .tab-item { flex: 1; padding: 15px; cursor: pointer; color: #888; font-weight: bold; }
        .tab-item.active { color: var(--gold); border-bottom: 3px solid var(--gold); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #111; }
        th, td { border: 1px solid #333; padding: 12px; text-align: center; font-size: 14px; }
        th { background: #222; color: var(--gold); }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <div class="card">
            <h2 style="color: var(--gold); margin-bottom: 5px;">MMC CLUB</h2>
            <p style="color: #888; margin-bottom: 20px;">Management System v4.0</p>
            <input type="tel" id="mobileInput" placeholder="Enter Mobile Number">
            <button class="btn-gold" onclick="generateScreenOTP()">GENERATE OTP</button>
            
            <div id="otp-area" style="display:none; margin-top: 25px; border-top: 1px solid #333; padding-top: 20px;">
                <p style="color: #D4AF37; font-weight: bold;" id="otp-display"></p>
                <input type="number" id="verifyInput" placeholder="Enter the OTP shown above">
                <button class="btn-gold" onclick="loginUser()">VERIFY & LOGIN</button>
            </div>
        </div>
    </div>

    <div id="app-content">
        <div style="background: #000; padding: 20px; border-bottom: 2px solid var(--gold);">
            <h2 style="color: var(--gold); margin: 0;">MMC CLUB DASHBOARD</h2>
        </div>
        
        <div class="tabs">
            <div id="t1" class="tab-item active" onclick="switchTab('all')">ALL RECORDS</div>
            <div id="t2" class="tab-item" onclick="switchTab('mine')">MY PAYMENTS</div>
        </div>

        <div class="container">
            <div id="all-view">
                <h3>Global Transactions</h3>
                <table>
                    <thead><tr><th>Details</th><th>Amount</th></tr></thead>
                    <tbody id="global-list"></tbody>
                </table>
            </div>

            <div id="mine-view" style="display:none;">
                <h3>My Ledger History</h3>
                <table>
                    <thead><tr><th>Date</th><th>Amount</th></tr></thead>
                    <tbody id="personal-list"></tbody>
                </table>
            </div>
